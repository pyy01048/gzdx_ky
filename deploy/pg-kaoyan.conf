# ============================================================
# 硕途考研平台 · PostgreSQL 调小参数（2C/2G/40G 约束，见 10 c.1）
# 安装：/etc/postgresql/<ver>/main/conf.d/kaoyan.conf
#   （Ubuntu 24.04 自带 PG16；22.04 需 PGDG 装 16 + postgresql-16-pgvector）
# 改完执行：systemctl restart postgresql
# 监听保持 127.0.0.1（postgresql.conf: listen_addresses='127.0.0.1'）
# ============================================================
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 32MB
effective_cache_size = 512MB
max_connections = 50
# 2G 机：适当降低 WAL/并行开销
wal_buffers = 4MB
max_worker_processes = 4
max_parallel_workers_per_gather = 1
# pgvector HNSW 构建期内存（建索引时临时调大更稳）
maintenance_work_mem = 64MB
