# ============================================================
# 硕途考研平台 · PostgreSQL 调小参数（2C/2G/40G 约束，见 10 c.1）
# 安装：/etc/postgresql/<ver>/main/conf.d/kaoyan.conf
#   （Ubuntu 24.04 自带 PG16；22.04 需 PGDG 装 16 + postgresql-16-pgvector）
# 改完执行：systemctl restart postgresql
# 监听保持 127.0.0.1（postgresql.conf: listen_addresses='127.0.0.1'）
# ============================================================
shared_buffers = 128MB
work_mem = 4MB
# 含 pgvector HNSW 建索引期内存；autovacuum 3 worker 最坏 ~192MB，2G 机可控。
# （原 32MB 与下方 64MB 重复定义、末值生效，已合并为单条避免死配置误导）
maintenance_work_mem = 64MB
effective_cache_size = 512MB
max_connections = 50
# 2G 机：适当降低 WAL/并行开销
wal_buffers = 4MB
max_worker_processes = 4
max_parallel_workers_per_gather = 1
