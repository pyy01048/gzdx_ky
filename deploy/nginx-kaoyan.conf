# ============================================================
# 硕途考研平台 · Nginx 站点配置
# 安装：/etc/nginx/sites-available/kaoyan -> symlink 到 sites-enabled
# 设计（见 10-部署 e.5）：
#   - 静态 + SPA 由 Nginx 直接服务（root=static，try_files 回退 index.html）
#   - /api/* 反代到本机 uvicorn 127.0.0.1:8000
#   - 安全头 / 限流 / 上传大小 / SSE 长连接
#
# 2026-10-18 公网开放（个人使用决策）：
#   用户为个人使用决定暂不备案、不开 HTTPS，直接开放公网 IP。
#   前置校验已通过：JWT 鉴权生效（未登录 /api/documents → 401）、
#   登录页可达、初始密码已设置。站点改为 default_server 同时服务
#   Tailscale 内网（100.72.33.1）与公网 IP（60.204.223.140）。
#   残留风险（用户已知情）：HTTP 明文传输密码；大陆节点未备案，
#   运营商/云厂商可能干扰 80 端口；IP 非固定。
#   域名 HTTPS 块仍保留（注释），备好域名备案后一键升级。
# ============================================================

# 限流区（登录/AI 等敏感路径复用）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ai_limit:10m  rate=2r/s;

# ---------- 主站点块：Tailscale 内网 + 公网 IP（default_server） ----------
server {
    listen 0.0.0.0:80 default_server;
    listen [::]:80 default_server;
    server_name 100.72.33.1 60.204.223.140 _;

    root /opt/kaoyan/backend-main-fastapi/static;
    index index.html;
    client_max_body_size 50m;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 后端 API（含 AI 流式 SSE：关闭缓冲、放宽超时）
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;            # SSE/流式
    }
    # 登录/注册路径：nginx 层再压一道（应用层另有限流），防公网爆破。
    # 注意：不含 refresh —— 前端 401 后会自动高频刷新 token，
    # 2026-10-18 曾把 refresh 误纳入本限流导致用户登录后卡死在刷新循环。
    location ~ ^/api/(auth|users)/(login|register) {
        limit_req zone=api_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    # AI 讲题/答疑更严格限流（按需调整路径前缀）
    location /api/ai/ {
        limit_req zone=ai_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # SPA：静态文件优先，未命中回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（带 hash，可安全长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ============================================================
# 公网块（默认注释）——启用前提（见 10 上线检查清单）：
#   1) [11] JWT+RBAC 已生效，管理/备份/采集/训练接口 401/403，默认密码已改
#   2) 域名已解析到本机且完成 ICP 备案（大陆节点）
#   3) 已配置 HTTPS（certbot/Caddy 自动续期）
