# ============================================================
# 硕途考研平台 · Nginx 站点配置
# 安装：/etc/nginx/sites-available/kaoyan -> symlink 到 sites-enabled
# 设计（见 10-部署 e.5）：
#   - 静态 + SPA 由 Nginx 直接服务（root=static，try_files 回退 index.html）
#   - /api/* 反代到本机 uvicorn 127.0.0.1:8000
#   - 安全头 / 限流 / 上传大小 / SSE 长连接
#
# 2026-10-18 公网开放（个人使用决策）：
#   用户为个人使用决定暂不备案、不开 HTTPS，直接开放公网 IP。
#   残留风险（用户已知情）：HTTP 明文传输密码；大陆节点未备案，
#   运营商/云厂商可能干扰 80 端口；IP 非固定。
#   域名 HTTPS 块仍保留（注释），备好域名备案后一键升级。
#
# 2026-11-21 V3.12 评审整改（B-01/B-05/B-07、C1/C9）：
#   - 快速失败：普通 API connect 3s / read+send 30s（原 600s 无 fast-fail，
#     后端假死时浏览器干等 10 分钟）。长任务白名单（AI SSE / 存储扫描入库 /
#     网盘同步 / 文档解析批处理 / KB 入库）保留 600s。
#   - 限流返回 429（原 nginx 默认 503，评审误判为「无爆破防护」的直接原因），
#     429/502/503/504 一律 JSON 错误壳 + Retry-After，不再吐 nginx HTML 默认页。
#   - server_tokens off（隐藏版本号）；nginx 层 gzip（静态资源；API 已由
#     应用 GZipApiMiddleware 压缩，nginx 不会二次压缩）。
#   - X-Request-ID：nginx 生成并透传给后端 + 回写响应头（全链路追踪）。
# ============================================================

# 限流区（登录/AI 等敏感路径复用）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ai_limit:10m  rate=2r/s;
# 限流拒绝一律 429（可机读 + Retry-After），不用默认 503
limit_req_status 429;
limit_conn_status 429;

# ---------- 主站点块：Tailscale 内网 + 公网 IP（default_server） ----------
server {
    listen 0.0.0.0:80 default_server;
    listen [::]:80 default_server;
    server_name 100.72.33.1 60.204.223.140 _;

    root /opt/kaoyan/backend-main-fastapi/static;
    index index.html;
    client_max_body_size 50m;
    server_tokens off;

    # gzip（静态资源兜底；上游已带 Content-Encoding 的响应不会二次压缩）
    gzip on;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # 安全响应头（完善方案 08 §3.3）
    # CSP 先以 Report-Only 跑一周收集违规（浏览器控制台可见），无违规后把下面两行
    # 的 "-Report-Only" 去掉转强制。SPA 无外链脚本；夸克网盘 iframe 若启用需加
    # frame-src https://pan.quark.cn；AI SSE 走 connect-src 'self' 已覆盖。
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Request-ID $request_id always;

    # 后端假死/限流时返回统一 JSON 错误壳（与 utils/exceptions 同构），
    # 不再吐 nginx HTML 默认页。proxy_intercept_errors 保持默认 off：
    # 应用自己返回的 4xx/5xx JSON 原样透传，只接管 nginx 自产的错误。
    error_page 429 = @rate_limited;
    error_page 502 503 = @backend_down;
    error_page 504 = @backend_timeout;

    # 注意：nginx 的 add_header 继承规则——location 内只要出现任意 add_header，
    # 就不再继承 server 级的 add_header。因此下面每个命名错误块都必须自带全套
    # 安全头，否则 429/502/504 响应会丢失 CSP/nosniff/XFO 等（TC-I 安全头一致性）。
    location @rate_limited {
        default_type application/json;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Retry-After 1 always;
        add_header X-Request-ID $request_id always;
        return 429 '{"code":"RATE_LIMITED","message":"请求过于频繁，请稍后再试","detail":{"retry_after":1}}';
    }
    location @backend_down {
        default_type application/json;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Request-ID $request_id always;
        return 502 '{"code":"BACKEND_UNAVAILABLE","message":"后端服务暂不可用，请稍后重试"}';
    }
    location @backend_timeout {
        default_type application/json;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Request-ID $request_id always;
        return 504 '{"code":"REQUEST_TIMEOUT","message":"后端响应超时，请稍后重试"}';
    }

    # 后端 API：快速失败（connect 3s / read+send 30s）。
    # SSE/流式与长任务走下方白名单 location，不受 30s 约束。
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;            # SSE/流式
    }
    # 登录/注册路径：nginx 层再压一道（应用层另有限流），防公网爆破。
    # 注意：不含 refresh —— 前端 401 后会自动高频刷新 token，
    # 2026-10-18 曾把 refresh 误纳入本限流导致用户登录后卡死在刷新循环。
    location ~ ^/api/(auth|users)/(login|register) {
        limit_req zone=api_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
    # AI 讲题/答疑：SSE 长连接 + 更严格限流
    location /api/ai/ {
        limit_req zone=ai_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
    # 存储库扫描/入库：全盘遍历实测 77s 级，保留长超时
    location /api/storage/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    # 网盘同步/入库：大目录同步分钟级
    location /api/netdisk/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    # KB 入库（解析+切块+向量化，单文件分钟级）
    location ~ ^/api/kb/ingest {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    # 文档重处理（解析/OCR/LLM 批处理/导出）：分钟级长任务白名单。
    # 列表 GET /api/documents 不在此列 —— 走 30s 快速失败。
    location ~ ^/api/documents/(parse-all|ocr|analyze-batch|scan-root|repair-file-paths|bulk|export|\d+/(parse|analyze|generate-quiz|extract-knowledge-points|extract-questions|preview-questions|confirm-questions|classify-chunks|archive))$ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 自托管图片资产（题图/院校封面/校徽等，DB 里存 /media/images/... 路径）：
    # 必须放在 SPA try_files 之前，否则会被回退成 index.html（200 text/html 坏图）
    location /media/images/ {
        alias /opt/kaoyan/backend-main-fastapi/data/storage/images/;
        # 不用 expires（会与下一行重复发 Cache-Control）；图片 URL 不带 hash，保持 30 天可替换。
        add_header Cache-Control "public, max-age=2592000";
        # 本 location 一旦出现 add_header 就不继承 server 级安全头（见上方继承规则），
        # 必须自带全套，否则图片响应丢 nosniff/XFO/CSP/X-Request-ID（TC-I 一致性）。
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Request-ID $request_id always;
        try_files $uri =404;
    }

    # 自托管字体（index.html 里 preload 的关键资源）：内容是版本化的固定文件，
    # 可安全长缓存 + immutable，避免每次进站重新协商（弱网下省一次 RTT）。
    location /fonts/ {
        # 不用 expires（它自己发一条 max-age=2592000，与下面的 1 年冲突）。
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Request-ID $request_id always;
        try_files $uri =404;
    }

    # PWA 图标/启动图：文件名固定、内容随发布更新，长缓存是安全的（图标更新走换名）。
    location /pwa/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Request-ID $request_id always;
        try_files $uri =404;
    }

    # PWA manifest：必须 application/manifest+json，否则浏览器判定 MIME 不受支持，
    # 安装能力/图标失效（nginx 自带 mime.types 未映射 .webmanifest，实测会吐 octet-stream）。
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Request-ID $request_id always;
        try_files $uri =404;
    }

    # Service Worker / workbox 运行时：必须每次回源校验，
    # 否则新版本发布后老 sw 会继续接管，用户拿到的是旧壳 + 已删除的旧 chunk（白屏）。
    location ~ ^/(sw\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Request-ID $request_id always;
        try_files $uri =404;
    }

    # 中国地图 GeoJSON（≈570KB，极少变更）：给中等缓存，避免每次进地图页都重新下载。
    location = /china.json {
        expires 7d;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Request-ID $request_id always;
        try_files $uri =404;
    }

    # SPA 入口：每次发布 static 目录整体替换（旧 hash chunk 被删除），
    # index.html 若被浏览器启发式缓存，就会加载已不存在的 chunk → 白屏。
    # 因此入口必须 no-cache（每次都回源校验，未变更时 304，代价一次 RTT）。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Request-ID $request_id always;
        try_files $uri =404;
    }

    # SPA 路由回退：真实文件直接给；目录与未命中路径走 @spa（回 index.html）。
    # 不用 try_files $uri $uri/ /index.html —— `$uri/` 会让 index 模块在当前
    # location 内直接吐 index.html，跳过 = /index.html 的 no-cache 头（实测丢头）。
    location / {
        try_files $uri @spa;
    }
    location @spa {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Request-ID $request_id always;
        try_files /index.html =404;
    }

    # 静态资源长缓存（带 hash，可安全长缓存）
    location /assets/ {
        # 不用 expires（它会再发一条 max-age=2592000 的 Cache-Control，造成重复头）；
        # Vite 产物文件名带内容 hash，1 年 + immutable 是安全上限。
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 同上：自带全套安全头，避免 add_header 继承断裂导致 JS/CSS 丢 nosniff 等。
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Request-ID $request_id always;
        try_files $uri =404;
    }
}

# ============================================================
# 方案 B（推荐，零成本零备案）：关公网，只走 Tailscale
# 把上面 server 块的 listen 改成下面两行，并 ufw deny 80/tcp：
#   listen 100.72.33.1:80;
#   # 删除 0.0.0.0:80 与 [::]:80
# 手机装 Tailscale 后体验与公网一致，流量全程 WireGuard 加密。
# 需要额外 TLS：tailscale cert 100.72.33.1（MagicDNS + HTTPS）。
# ============================================================

# ============================================================
# 方案 A（要公开分享时）：域名 + 备案 + certbot
#   1) [11] JWT+RBAC 已生效，管理/备份/采集/训练接口 401/403，默认密码已改
#   2) 域名已解析到本机且完成 ICP 备案（大陆节点）
#   3) sudo certbot --nginx -d 你的域名（自动续期 cron）
#   4) TLS 生效后：移除服务器 env 的 COOKIE_SECURE=0 过渡开关，
#      并启用下方 HSTS 头（V3.12 评审 B-02 收尾动作）
# 取消注释并把 你的域名 替换为实际域名：
# ============================================================
# server {
#     listen 80;
#     server_name 你的域名;
#     location / { return 301 https://$host$request_uri; }
# }
# server {
#     listen 443 ssl http2;
