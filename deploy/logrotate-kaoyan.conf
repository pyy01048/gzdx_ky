# 硕途考研平台 · 日志轮转（完善方案 09 §3.4）
# 安装：sudo cp deploy/logrotate-kaoyan.conf /etc/logrotate.d/kaoyan
# 校验：sudo logrotate -d /etc/logrotate.d/kaoyan
/opt/kaoyan/backend-main-fastapi/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su www-data www-data
}

# monitor_kaoyan.py 的存活监控日志（root cron 写 /opt/kaoyan/logs/，每分钟追加）
# 此前漏覆盖 → 监控日志无限增长；纳入轮转。
/opt/kaoyan/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
}

/var/log/kaoyan-backup.log /var/log/kaoyan-watchdog.log {
    weekly
    rotate 8
    compress
    missingok
    notifempty
    copytruncate
}
# journald 限额（另需手工）：
#   /etc/systemd/journald.conf → SystemMaxUse=200M
#   systemctl restart systemd-journald
