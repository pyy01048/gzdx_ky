<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F7" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230A84FF'/%3E%3Cstop offset='1' stop-color='%230062CC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Cpath d='M20 17.5h14.2c6.2 0 10.3 3.3 10.3 8.6 0 3.7-2.2 6.4-5.6 7.6v.2c3.9.7 6.8 3.6 7.3 8.2.6 5.2-2.4 9.4-9.8 9.4H20V17.5zm6.6 13.4h6.4c3 0 4.8-1.7 4.8-4.2 0-2.6-1.8-4.1-4.8-4.1h-6.4v8.3zm0 15.4h7c3.3 0 5.3-1.8 5.3-4.6 0-2.8-2-4.6-5.3-4.6h-7V46.3z' fill='%23FFFFFF'/%3E%3C/svg%3E" />
    <meta name="description" content="硕途 · 考研学习平台：倒计时与每日计划、单词间隔重复、章节刷题与真题、错题艾宾浩斯复习、复试代码上机、院校库与网盘资料，知识地图串联全流程，支持电脑 / 平板 / 手机三端" />
    <title>硕途 · 考研学习平台</title>
    <script>
      // 首帧防闪（FOUC）：在首屏渲染前把持久化的主题偏好写到 <html data-theme>。
      // React 挂载后由 useResolvedTheme（components/UI.jsx）接管，此处只负责「渲染前」这一段。
      (function () {
        var STORE_KEY = 'kaoyan-archive-v1'
        var theme = 'light'
        try {
          var raw = window.localStorage.getItem(STORE_KEY)
          if (raw) {
            var parsed = JSON.parse(raw)
            var stored = parsed && parsed.state && parsed.state.settings && parsed.state.settings.theme
            if (stored === 'light' || stored === 'dark' || stored === 'system') theme = stored
          }
        } catch (e) {
          theme = 'light'
        }
        if (theme === 'system') {
          theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#1C1C1E' : '#F5F5F7')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // HashRouter 兼容：直接访问裸路径（/quiz 等）时重写为 hash 路由，
      // 避免无 hash 访问 fallback 到首页
      (function () {
        var path = window.location.pathname
        if (path && path !== '/' && !window.location.hash) {
          var target = '/#' + path + window.location.search + window.location.hash
          window.location.replace(target)
        }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
