# ===========================================================================
# 考研通知「重要性分级 + 关键日期抽取」规则配置
# ---------------------------------------------------------------------------
# 用户可自行编辑本文件增删关键词，无需改业务代码。
# 读取方：services/kaoyan/notice_alert.py（load_rules）
# 生效方式：改完立即生效（每次调用都重新读盘并按 mtime 缓存，无需重启）。
# 也可用环境变量覆盖规则文件路径：
#   NOTICE_ALERT_RULES=D:\path\to\my_rules.yaml
#
# ---------------------------------------------------------------------------
# importance_levels 分级定义（自上而下匹配，命中即停，权重可叠加）
#   urgent   紧急 —— 不看就会错过报名/复试/录取节点
#   important 重要 —— 影响备考决策的规则性文件
#   normal   普通 —— 常规公告
#
# type_weight：notice_type 本身带来的基础分（命中 keyword 之外的独立加分项）
# keyword_rules：命中关键词 → {level, score, reason}
#   keyword 支持在词首用 `-` 表示「必须不含」该词的排除条件，例如：
#     - keyword: "录取"
#       not_contains: ["招生", "目录"]     # 「拟录取」要命中，「录取名单」也算，
#                                           # 但「招生录取」不算
# ===========================================================================

version: 3

# --------------------------------------------------------------------------
# 分级阈值：总分 >= urgent_score 判紧急；>= important_score 判重要；否则普通
# --------------------------------------------------------------------------
thresholds:
  urgent_score: 40
  important_score: 15

# --------------------------------------------------------------------------
# 通知类型基础分
# --------------------------------------------------------------------------
type_weight:
  调剂: 30
  复试: 25
  录取: 28
  简章: 12
  目录: 12
  大纲: 12
  考试大纲: 12
  分数线: 30
  公告: 0
  其他: 0
default_type_weight: 0

# --------------------------------------------------------------------------
# 关键词规则（按列表顺序匹配；同一level 的多条规则分数会叠加）
#   keywords  —— 字面关键词，词首加 `-` 表示「仅作排除」
#   regex     —— 正则（只匹配标题），适合「(初试)」「考试.时间」这类变体
#   not_contains / not_contains_regex —— 命中则整条规则作废（消歧）
#   max_score —— 同一条规则最多计一次分（避免长标题里多个词刷分）
# --------------------------------------------------------------------------
keyword_rules:
  # ================= 强制定档：与用户身份无关的噪声，直接压成普通 =================
  # 本平台用户是**硕士研究生**，所以纯博士/学位/党务类通知一律降级，
  # 否则「拟录取博士名单」会淹没「拟录取硕士名单」，反而更容易漏。
  - level: normal
    score: 0
    force_level: true
    reason: 纯博士相关（用户是硕士考生，与我无关）
    keywords: ["博士"]
    # 注意：这里**不能**把「硕博」当排除词 —— 「博士研究生(硕博连读)各学院复试方案」
    # 含「硕博」但仍是纯博士复试，会漏过降级规则去污染角标。
    # 真正需要豁免的是「同时含硕士培养」的那几种复合表述。
    not_contains: ["硕士", "本硕", "工程硕博士"]

  # ================= 紧急：不看就会错过节点 =================
  # 报名类（urgent）
  # 补「报名公告 / 招生考试报名 / 报名确认」这组措辞的原因：
  # 真实数据里最典型的报名节点是「XX大学2027年全国硕士研究生招生考试报名公告」，
  # 它既不含「网上报名」也不含任何截止日期字样，早先只靠「网上报名」三字侥幸命中，
  # 导致同类公告（重庆邮电大学/清华/华中师大报名公告等）全部漏判为普通 —— 而这
  # 恰恰是考研人最容易错过的节点。
  - level: urgent
    score: 50
    reason: 报名/提交/确认有硬截止
    keywords: ["报名截止", "截止日期", "截止时间", "网上报名", "预报名", "现场确认", "确认时间", "报考点", "网上确认", "报名公告", "报名确认", "招生考试报名", "研究生招生报名"]
    regex: ["(报名|提交|填报|确认).{0,8}(截止|截至)", "截止(日期|时间|到)", "(硕士|研究生)?招生.{0,14}报名"]
    # 「硕士研究生报名」「硕士报名系统」这类是占位/脏数据标题（无年份、无院校动作），
    # 不应被当成真实报名节点拉成紧急，故排除裸词式短标题。
    not_contains: ["报名系统"]
    max_score: 1

  - level: urgent
    score: 50
    reason: 拟录取结果公示
    keywords: ["拟录取", "录取名单", "录取结果", "预录取", "录取公示", "复试成绩"]
    regex: ["拟录取.{0,10}(名单|公示|结果)", "(复试|录取).{0,6}名单"]
    max_score: 1

  - level: urgent
    score: 48
    reason: 调剂（窗口极短）
    keywords: ["调剂", "调剂系统", "调剂志愿", "调剂复试"]
    regex: ["调剂"]
    max_score: 1

  - level: urgent
    score: 48
    reason: 初试/考试具体时间与科目
    keywords: ["考试时间", "初试时间", "命题科目", "准考", "打印准考证", "考试安排", "报考点"]
    # 注意 1：不要在此匹配「科目调整/科目变更」—— 那是**重要**级（政策变更），
    #         不是紧急级（有硬截止），混进来会把「专业目录科目调整」误当急件。
    # 注意 2：不要放裸词「自命题」「考试大纲」—— 「XX大学自命题科目考试大纲」
    #         是纲领性文件（重要级）而非时间节点，裸词会把它顶成紧急。
    regex: ["(初试|考试).{0,4}(于|在)?\\s*\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日", "\\(初试\\)", "（初试）", "考试.?时间"]
    # 「自命题科目考试大纲」虽含「初试」但属纲领文件，用 not_contains 排除，
    # 让它落到下面的「重要」规则，而不是被顶成紧急。
    not_contains: ["考试大纲", "命题科目"]
    # 注意：不要在这里匹配「科目调整/科目变更」—— 那是**重要**级（政策变更），
    # 不是紧急级（有硬截止）。放紧急级会导致「专业目录科目调整」被误当急件。
    max_score: 1

  - level: urgent
    score: 48
    reason: 复试分数线公布
    keywords: ["复试分数线", "复试线", "国家线", "院校复试线", "分数基本线", "分数线"]
    regex: ["复试.{0,4}分数线", "分数线"]
    max_score: 1

  - level: urgent
    score: 30
    reason: 复试安排/名单（部分院校细则不含日期）
    keywords: ["复试时间", "复试安排", "复试名单", "复试资格", "复试通知", "复试办法", "复试录取", "复试工作"]
    regex: ["复试.{0,6}(细则|名单|安排|资格|通知|办法)"]
    max_score: 1

  - level: urgent
    score: 30
    reason: 需立即动作（缴费/放弃/调档）
    keywords: ["放弃复试", "放弃录取", "违约", "缴纳", "缴费", "录取通知书", "调档"]
    max_score: 1

  # ================= 重要：影响备考决策的规则性文件 =================
  - level: important
    score: 22
    reason: 招生政策/目录/大纲/参考书目
    keywords: ["参考书目", "考试科目调整", "科目调整", "科目调整情况", "大纲调整", "专业目录", "招生专业", "招生计划", "招生简章", "考试大纲", "自命题科目考试大纲", "培养方案", "学制", "学费", "奖助", "参考书目变更", "初试科目", "考试科目"]
    regex: ["招生简章", "专业目录", "考试大纲", "参考书目", "招生计划", "(科目|专业|目录|大纲|初试).{0,4}(调整|变更)"]
    max_score: 1

  - level: important
    score: 18
    reason: 招生政策变化/新增取消专业
    keywords: ["调整", "改革", "新增专业", "取消专业", "停招", "扩招", "更名", "新设"]
    regex: ["(新增|取消|停招|调整).{0,6}(专业|科目|方向|学院)"]
    max_score: 1

  # ================= 普通：显式降级，剔除党务/活动等噪声 =================
  - level: normal
    score: 0
    reason: 与考研无关的党务/活动类
    keywords: ["党支部", "支部", "党委", "党建", "工会", "招标", "采购", "学位材料", "博士答辩", "直播预告", "宣讲会", "校园开放日", "参观", "讲座", "会议通知", "放假", "通知公告"]
    not_contains: ["硕士", "研究生招生", "复试", "调剂", "录取", "报名"]
    not_contains_regex: ["招生|复试|调剂|录取|报名|初试"]
    max_score: 1

  # ================= 噪声标记（step-1：只落 importance_reason，绝不改 level/score）=================
  # 以下 5 条是「考研通知噪声识别」新增判据（detect_notice_noise.py）的单一事实来源，
  # 写入 YAML 供用户自维护。设计要点（team-lead 2026-10-12 裁定）：
  #   * score: 0 且**不配 force_level** —— 命中后**不改变** importance_level / importance_score，
  #     只把「噪声:<类别>」写进 importance_reason，供前端过滤 / 查询；
  #   * not_contains_regex 带招生信号一票否决 —— 任何含招生词的真通知都不会被误标；
  #   * 本批规则仅做「标记」，是否真的降级（important/normal 重定档）留待 step-2 裁决
  #     （step-2 前置安全断言：任何带招生信号的通知不得被降级）。
  - level: normal
    score: 0
    reason: 噪声:节气
    keywords: ["立春", "雨水", "惊蛰", "春分", "清明", "谷雨", "立夏", "小满", "芒种",
               "夏至", "小暑", "大暑", "立秋", "处暑", "白露", "秋分", "寒露", "霜降",
               "立冬", "小雪", "大雪", "冬至", "小寒", "大寒"]
    not_contains_regex: ["招生|简章|复试|调剂|录取|拟录取|报名|初试|目录|大纲|参考书目|分数线|推免|考点|准考证"]
    max_score: 1

  - level: normal
    score: 0
    reason: 噪声:节日祝福
    keywords: ["中秋", "元宵", "新春", "元旦", "端午", "粽", "劳动节", "三八", "妇女节",
               "青年节", "国庆", "七夕", "春节", "过年", "拜年", "阖家", "祝福", "安康",
               "喜乐", "岁序", "辞旧", "劳动最光荣", "建党", "建军"]
    regex: ["庆祝.*成立"]
    not_contains_regex: ["招生|简章|复试|调剂|录取|拟录取|报名|初试|目录|大纲|参考书目|分数线|推免|考点|准考证"]
    max_score: 1

  - level: normal
    score: 0
    reason: 噪声:栏目名
    regex: ["^(现任|历任|第?\\d+届)?领导", "^(学校|我校|学院)?(简介|概况|章程)$",
            "^(校园|学校)?(地图|风貌|掠影|晨曦|风光|美景)$", "^(学报|校报|期刊|简报)$",
            "^(组织机构|院系设置|部门设置)$", "^[^\\s]{2,10}(工程学院|学院|学部|研究院)$",
            "^(通知公告|公告|新闻|动态|首页)$", "举报中心$"]
    not_contains_regex: ["招生|简章|复试|调剂|录取|拟录取|报名|初试|目录|大纲|参考书目|分数线|推免|考点|准考证"]
    max_score: 1

  - level: normal
    score: 0
    reason: 噪声:赛事活动
    keywords: ["竞赛", "挑战赛", "锦标赛", "巡回赛", "联赛", "运动会", "球赛", "研讨会",
               "座谈会", "论坛", "报告会", "开幕式", "闭幕式", "典礼", "慰问", "考察",
               "调研", "走访", "座谈", "授牌", "签约", "揭牌", "义诊", "演出", "晚会",
               "文化节", "艺术节", "开放日", "主题党日", "党史", "党课", "组织生活",
               "党员", "党组织", "中华民族", "统一战线", "统战"]
    not_contains_regex: ["招生|简章|复试|调剂|录取|拟录取|报名|初试|目录|大纲|参考书目|分数线|推免|考点|准考证"]
    max_score: 1

  - level: normal
    score: 0
    reason: 噪声:疑似人名
    regex: ["^[\\u4e00-\\u9fa5]{2,4}$"]
    not_contains_regex: ["招生|简章|复试|调剂|录取|拟录取|报名|初试|目录|大纲|参考书目|分数线|推免|考点|准考证"]
    max_score: 1

# --------------------------------------------------------------------------
# 关键日期抽取
# --------------------------------------------------------------------------
# event_keywords：日期短语前面的语义词 → 事件类型
#   deadline_signup  报名/提交/确认截止   → 产生「待办型截止日」提醒
#   deadline_exam     考试/初试日期
#   event_retest      复试日期
#   event_score       成绩公布/查询
#   event_adjust      调剂开放/系统开放
#   date_other        其他提及的日期（仅展示，不提醒）
# deadline_kinds：哪些事件类型算「必须行动」的截止日（进临期提醒）
# --------------------------------------------------------------------------
date_extraction:
  enabled: true
  deadline_kinds: ["deadline_signup", "deadline_exam"]
  event_keywords:
    deadline_signup: ["报名截止", "报名时间", "截止日期", "截止时间", "网上报名", "预报名", "现场确认", "确认时间", "提交", "截止", "之前", "前报送", "前完成"]
    deadline_exam: ["考试时间", "初试", "考试日期", "考试安排", "考试"]
    event_retest: ["复试", "复试时间", "面试", "考核"]
    event_score: ["成绩", "查成绩", "成绩查询", "分数公布", "公布成绩", "复试成绩"]
    event_adjust: ["调剂", "调剂系统", "调剂志愿"]
    date_other: ["公示", "答辩", "会议", "宣讲"]
  # 命中「后缀型截止词」时，日期解释为「该日之前/当天」；否则视为当日事件日
  deadline_suffixes: ["截止", "之前", "前", "以内", "当日"]

# --------------------------------------------------------------------------
# 临期提醒参数
# --------------------------------------------------------------------------
alert:
  # 距截止日 <= deadline_within_days 视为临期
  deadline_within_days: 21
  # 新通知（订阅/高等级）回看窗口
  new_notice_within_days: 7
  # 订阅流回看窗口
  subscription_feed_days: 3
  # 每天扫描时刻（本地 Asia/Shanghai）
  daily_hour: 7
  daily_minute: 40
  # 同一 notice_id + alert_kind 只提醒一次（跨天也不重复）
  dedupe_across_days: true
