# -*- coding: utf-8 -*-
[pytest]
# 测试只在 tests/ 里收。仓库里还有四个 `*_test.py` / `test_*.py` 形态的**独立自测脚本**
# （scripts/notice_alert_api_test.py、scripts/notice_import_body_test.py、
#  scripts/test_cross_source_dedupe.py、test_merged_model.py），它们按
#  `python scripts/x.py` 的用法在模块级跑断言并 `raise SystemExit`，
#  被 pytest 当用例 import 会让整个收集阶段 INTERNALERROR（实测 2026-10-13）；
#  test_merged_model.py 更会直接加载 merged 权重。显式 `pytest tests` 不受本行影响。
testpaths = tests
