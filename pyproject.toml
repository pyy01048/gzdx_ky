[tool.ruff]
target-version = "py313"
line-length = 120
# 先宽后紧（docs/完善方案/04 §3.1）：一次性几千条告警会淹没人，存量按目录分批清零
extend-exclude = ["_archive", "training", "tools/ocr/DeepSeek-OCR"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]   # 错误/flake8/警告/bugbug/import排序/升级建议
# 存量治理策略（docs/完善方案/04 §2.1）：新代码 0 error；存量按目录分批清零。
# 第一步只开启高价值目：未用 import/未用变量/无效转义/文件末尾换行等可安全自动修复项；
# UP0xx（PEP585/604 现代化）、W191（tab缩进）、B008 等存量量大且需人工确认，先豁免后逐迭代缩小。
ignore = [
    "E501",       # 行长交给 format
    "UP006", "UP045", "UP007", "UP035", "UP009", "UP031", "UP032", "UP015", "UP017", "UP025",  # 存量风格现代化，分批做
    "W191",       # 存量 tab 缩进（1203 处），ruff format 会逐步消化
    "B008",       # FastAPI Depends 用法是项目惯例
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]                     # 脚本常见 sys.path 前置

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = false        # 第一阶段只查已标注函数
follow_imports = "silent"

[tool.pytest.ini_options]
# 测试根目录约定：backend-main-fastapi/tests
testpaths = ["backend-main-fastapi/tests"]
