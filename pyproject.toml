[tool.ruff]
target-version = "py313"
line-length = 120
# 先宽后紧（docs/完善方案/04 §3.1）：一次性几千条告警会淹没人，存量按目录分批清零
extend-exclude = ["_archive", "training", "tools/ocr/DeepSeek-OCR", "backend-main-fastapi/scripts/data/ECDICT-master"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]   # 错误/flake8/警告/bugbug/import排序/升级建议
# 存量治理策略（docs/完善方案/04 §2.1）：新代码 0 error；存量按目录分批清零。
# 第一步只开启高价值目：未用 import/未用变量/无效转义/文件末尾换行等可安全自动修复项；
# UP0xx（PEP585/604 现代化）、W191（tab缩进）、B008 等存量量大且需人工确认，先豁免后逐迭代缩小。
ignore = [
    "E501",       # 行长交给 format
    "UP006", "UP045", "UP007", "UP035", "UP009", "UP031", "UP032", "UP015", "UP017", "UP025", "UP037",  # 存量风格现代化，分批做
    "W191",       # 存量 tab 缩进（1203 处），ruff format 会逐步消化
    "B008",       # FastAPI Depends 用法是项目惯例
    # 存量风格问题（全量优化后存量仍多，分批清零）
    "E402",       # 惰性导入是项目设计模式（避免循环依赖）
    "E701", "E702",  # 一行多条语句（存量风格）
    "E741",       # 模糊变量名（l/I 等存量）
    "E722",       # bare-except（存量需人工确认）
    "B007",       # 循环变量未使用
    "B017", "B018", "B023",  # assert/表达式/循环变量（存量）
    "B904",       # raise-without-from（存量需人工确认）
    "F401", "F811", "F822",  # 未使用import/重定义/未定义导出（存量）
    "I001",       # 导入排序（存量脚本有 sys.path 前置等特殊模式）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]                     # 脚本常见 sys.path 前置
"backend-main-fastapi/main.py" = ["E402"]  # load_dotenv 必须先于模块级 import
"backend-main-fastapi/routers/study/growth.py" = ["F821"]  # User 由 Depends 注入，导入在 __init__
# SQLAlchemy 跨分片 relationship 前向引用（Mapped["X"] / relationship("X")）由共享 Base
# registry 在 mapper 配置期解析，X 不必在本模块 import 期可见，故 F821 为误报。
"**/core/models/*.py" = ["F821"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = false        # 第一阶段只查已标注函数
follow_imports = "silent"

[tool.pytest.ini_options]
# 测试根目录约定：backend-main-fastapi/tests
testpaths = ["backend-main-fastapi/tests"]
