# 密钥扫描 + 大文件拦截 + 通用卫生（docs/完善方案/02-密钥与敏感信息治理.md §3.3）
# 安装：pip install pre-commit && pre-commit install
repos:
  # gitleaks 官方 hook 本机首次运行要拉 Go 模块编译（网络受限时拖不动），
  # 改为本地包装脚本：有 gitleaks 可执行就扫 staged，没有就跳过（CI job 兜底）。
  - repo: local
    hooks:
      - id: gitleaks-local
        name: gitleaks（本地缺失时跳过，CI job 兜底）
        entry: sh .githooks/gitleaks-local.sh
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files      # >500KB 拒绝提交（挡 dump/tar.gz）
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: '\.bat$'
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: '\.(bat|cmd)$'           # .bat 必须 CRLF（make_bats.py 校验）
      - id: check-yaml
        files: '^(\.pre-commit-config\.yaml|\.gitleaks\.toml|\.github/.*\.ya?ml)$'

  # 前端 lint（完善方案 07 §3.1）；eslint 已进 devDependencies，装一次 node_modules 即可。
  - repo: local
    hooks:
      - id: eslint
        name: eslint（frontend/src）
        entry: bash -c 'cd frontend && npx --no-install eslint src --max-warnings=400'
        language: system
        files: ^frontend/src/.*\.(js|jsx)$
        pass_filenames: false

  # 后端 ruff（完善方案 04 §3.1）：只对本次提交的 py 生效，存量分批清零。
  # rev 与 pyproject 规则集对齐（UP045 等需要 ruff ≥0.47）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        files: ^backend-main-fastapi/.*\.py$
      - id: ruff-format
        files: ^backend-main-fastapi/.*\.py$
